<!DOCTYPE html>
<!-- 🟢 MAVZU: `class="dark"` QATTIQCHA yozilgan edi. Tailwind
     `dark:` variantlari (hover:bg-white/5 va h.k.) shundan DOIM
     yoniq bo'lardi va yorug' rejimda ham oq yuvish qo'yilardi.
     Endi `App.tsx` `document.documentElement` ga haqiqiy mavzuni
     yozadi. Boshlang'ich qiymat `dark` — ilova qorong'i rejimdan
     boshlanadi (Telegram WebApp odatda shunday beradi). -->
<html lang="uz" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <!-- Telegram WebApp splash belgisi: @BotFather -> "Set Splash Icon" ->
         public/splash.svg (512x512, bitta <path>) faylini tanlang -->
    <link rel="apple-touch-icon" href="/splash.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- 📛 BREND. Mijoz so'radi: «NEON STORE — Telegram Stars,
         Premium & Gifts Bot & Web App» emas, balki
         «NeonShop — Telegram Raqamli Xizmatlar».
         Bu sarlavha Telegram'da h Share havolasida, brauzer
         tabida va iOS'da WebApp ochilganda ko'rinadi. -->
    <title>NeonShop — Telegram Raqamli Xizmatlar</title>
    <meta name="description" content="NeonShop — Telegram Stars, Premium, Giftlar va NFT ijarasi. Xarid, to'ldirish, reyting va bonuslar bitta Telegram Mini App'da." />
    <meta name="application-name" content="NeonShop" />
    <meta property="og:site_name" content="NeonShop" />
    <meta property="og:title" content="NeonShop — Telegram Raqamli Xizmatlar" />
    <meta property="og:description" content="NeonShop — Telegram Stars, Premium, Giftlar va NFT ijarasi. Xarid, to'ldirish, reyting va bonuslar bitta Telegram Mini App'da." />
    <meta property="og:type" content="website" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0b0e14] text-slate-100 min-h-screen font-['Plus_Jakarta_Sans',sans-serif] antialiased selection:bg-purple-500 selection:text-white overflow-x-clip">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
