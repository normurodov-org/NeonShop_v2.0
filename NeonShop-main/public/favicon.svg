<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="45%" stop-color="#9333ea" />
      <stop offset="85%" stop-color="#c026d3" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>

    <!-- Star gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Drop shadows -->
    <filter id="letterShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#4c1d95" flood-opacity="0.45" />
    </filter>
    <filter id="starShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#4c1d95" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Letter N Structure with shadow -->
  <g filter="url(#letterShadow)">
    <!-- Diagonal connector with soft purple shade -->
    <path d="M 205 175 L 320 335 L 290 350 L 175 190 Z" fill="#ede9fe" opacity="0.9" />

    <!-- Left vertical bar (thick rounded pill) -->
    <rect x="170" y="155" width="60" height="210" rx="30" fill="#ffffff" />

    <!-- Right vertical bar (rounded pill) -->
    <rect x="282" y="210" width="60" height="150" rx="30" fill="#ffffff" />
  </g>

  <!-- Golden 5-point Star on top-right of the N -->
  <g filter="url(#starShadow)">
    <!-- Star rotated slightly to match the logo -->
    <path d="M 312 120 
             L 326 150 
             L 358 153 
             L 333 175 
             L 341 206 
             L 312 189 
             L 283 206 
             L 291 175 
             L 266 153 
             L 298 150 Z" 
          fill="url(#starGrad)" 
          stroke="#f59e0b" 
          stroke-width="2" 
          stroke-linejoin="round" />
  </g>
</svg>
