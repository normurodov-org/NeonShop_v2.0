<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="NEON STORE — Telegram Stars, Premium va Gifts savdo boti">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0820"/>
      <stop offset="0.55" stop-color="#120c34"/>
      <stop offset="1" stop-color="#06131f"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#22e4ff;#ff4fd8;#8b5cf6" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#22e4ff">
        <animate attributeName="stop-color" values="#22e4ff;#ff4fd8;#8b5cf6;#22e4ff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#ff4fd8">
        <animate attributeName="stop-color" values="#ff4fd8;#8b5cf6;#22e4ff;#ff4fd8" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glowV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22e4ff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#22e4ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="card"><rect width="1200" height="380" rx="28"/></clipPath>
    <style>
      .title { font: 900 92px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 10px; }
      .sub { font: 600 25px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #c9cdf0; letter-spacing: 1px; }
      .chip { font: 700 18px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #e9ebff; }
      .star { animation: twinkle 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .s2 { animation-delay: .6s } .s3 { animation-delay: 1.2s } .s4 { animation-delay: 1.8s } .s5 { animation-delay: 2.4s }
      @keyframes twinkle { 0%,100% { opacity: .25; transform: scale(.7) } 50% { opacity: 1; transform: scale(1.15) } }
      .float { animation: float 5s ease-in-out infinite; }
      .float2 { animation: float 6s ease-in-out -2s infinite; }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-12px) } }
      .reveal { animation: reveal 1.6s cubic-bezier(.2,.8,.2,1) both; }
      .reveal2 { animation: reveal 1.6s cubic-bezier(.2,.8,.2,1) .5s both; }
      .reveal3 { animation: reveal 1.6s cubic-bezier(.2,.8,.2,1) 1s both; }
      @keyframes reveal { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: none } }
      .scan { animation: scan 4s linear infinite; }
      @keyframes scan { from { transform: translateX(-300px) } to { transform: translateX(1500px) } }
      .orbit { animation: spin 18s linear infinite; transform-origin: 1010px 190px; }
      @keyframes spin { to { transform: rotate(360deg) } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <circle cx="180" cy="80" r="220" fill="url(#glowV)"/>
    <circle cx="1040" cy="330" r="240" fill="url(#glowC)"/>

    <!-- grid -->
    <g stroke="#ffffff" stroke-opacity="0.04">
      <path d="M0 95H1200M0 190H1200M0 285H1200"/>
      <path d="M150 0V380M300 0V380M450 0V380M600 0V380M750 0V380M900 0V380M1050 0V380"/>
    </g>

    <!-- scan line -->
    <rect class="scan" x="0" y="0" width="160" height="380" fill="#ffffff" opacity="0.04" transform="skewX(-20)"/>

    <!-- orbit + planet -->
    <g class="orbit">
      <ellipse cx="1010" cy="190" rx="120" ry="120" fill="none" stroke="#22e4ff" stroke-opacity="0.25" stroke-dasharray="4 10"/>
      <circle cx="1130" cy="190" r="9" fill="#22e4ff"/>
      <circle cx="890" cy="190" r="6" fill="#ff4fd8"/>
    </g>
    <g class="float">
      <circle cx="1010" cy="190" r="70" fill="#8b5cf6" opacity="0.25" filter="url(#blur)"/>
      <path d="M1010 128 L1027 170 L1072 174 L1038 203 L1049 247 L1010 224 L971 247 L982 203 L948 174 L993 170 Z"
            fill="#ffc53d" stroke="#fff3c4" stroke-width="3" stroke-linejoin="round"/>
    </g>

    <!-- twinkling stars -->
    <g fill="#ffffff">
      <path class="star" d="M80 300l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
      <path class="star s2" d="M720 60l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
      <path class="star s3" d="M860 320l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#22e4ff"/>
      <path class="star s4" d="M560 330l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#ff4fd8"/>
      <path class="star s5" d="M1150 60l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#ffc53d"/>
      <circle class="star s3" cx="420" cy="40" r="2.5"/>
      <circle class="star" cx="640" cy="200" r="2"/>
      <circle class="star s4" cx="40" cy="160" r="2.5"/>
    </g>

    <!-- text -->
    <g class="reveal">
      <text x="70" y="170" class="title" fill="url(#neon)">NEON STORE</text>
    </g>
    <g class="reveal2">
      <text x="74" y="222" class="sub">Telegram Stars · Premium · Gifts — so'mda, avtomatik</text>
    </g>

    <g class="reveal3">
      <g class="float2">
        <rect x="74" y="258" width="168" height="44" rx="22" fill="#ffc53d" fill-opacity="0.14" stroke="#ffc53d" stroke-opacity="0.5"/>
        <text x="158" y="287" class="chip" text-anchor="middle">⭐ Stars</text>
      </g>
      <g class="float">
        <rect x="256" y="258" width="190" height="44" rx="22" fill="#8b5cf6" fill-opacity="0.18" stroke="#8b5cf6" stroke-opacity="0.6"/>
        <text x="351" y="287" class="chip" text-anchor="middle">💎 Premium</text>
      </g>
      <g class="float2">
        <rect x="460" y="258" width="160" height="44" rx="22" fill="#ff4fd8" fill-opacity="0.14" stroke="#ff4fd8" stroke-opacity="0.5"/>
        <text x="540" y="287" class="chip" text-anchor="middle">🎁 Gifts</text>
      </g>
      <g class="float">
        <rect x="634" y="258" width="196" height="44" rx="22" fill="#22e4ff" fill-opacity="0.12" stroke="#22e4ff" stroke-opacity="0.5"/>
        <text x="732" y="287" class="chip" text-anchor="middle">💳 Avto-to'lov</text>
      </g>
    </g>
  </g>
  <rect width="1199" height="379" x="0.5" y="0.5" rx="28" fill="none" stroke="url(#neon)" stroke-opacity="0.7" stroke-width="1.5"/>
</svg>
