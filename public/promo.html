<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEON STORE — Promo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050505;
      color: #fff;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .bg {
      position: fixed; inset: 0; z-index: 0; overflow: hidden;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: .55;
      animation: float 14s ease-in-out infinite alternate;
    }
    .b1 { width: 420px; height: 420px; background: #7c3aed; top: -80px; left: -80px; }
    .b2 { width: 380px; height: 380px; background: #c026d3; bottom: -60px; right: -60px; animation-delay: -4s; }
    .b3 { width: 300px; height: 300px; background: #0ea5e9; top: 40%; left: 50%; animation-delay: -8s; }

    @keyframes float {
      0% { transform: translate(0,0) scale(1); }
      100% { transform: translate(80px,60px) scale(1.2); }
    }

    .glass {
      position: relative; z-index: 1;
      width: min(92vw, 460px);
      padding: 48px 36px;
      border-radius: 36px;
      background: rgba(255,255,255,.06);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.15);
      text-align: center;
      animation: pop .8s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes pop {
      from { transform: translateY(30px) scale(.96); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    .logo {
      width: 96px; height: 96px; margin: 0 auto 20px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(168,85,247,.5);
      animation: logoFloat 4s ease-in-out infinite;
      overflow: hidden;
    }
    @keyframes logoFloat {
      0%,100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
    }

    h1 {
      font-size: 28px; letter-spacing: .5px; margin-bottom: 8px;
      background: linear-gradient(90deg,#c084fc,#f472b6,#818cf8);
      background-size: 200% 200%;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: hue 6s ease-in-out infinite;
    }
    @keyframes hue { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }

    p { font-size: 14px; color: rgba(255,255,255,.65); line-height: 1.5; margin-bottom: 24px; }

    .pill {
      display: inline-block; padding: 10px 22px; border-radius: 999px;
      background: rgba(168,85,247,.18);
      border: 1px solid rgba(168,85,247,.5);
      font-weight: 600; font-size: 13px; color: #d8b4fe;
      animation: pulse 2.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(168,85,247,.4); }
      50% { box-shadow: 0 0 0 12px rgba(168,85,247,0); }
    }
  </style>
</head>
<body>
  <div class="bg">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <div class="glass">
    <div class="logo">
      <img src="/logo.svg" alt="NEON STORE" style="width:100%;height:100%" />
    </div>
    <h1>NEON STORE</h1>
    <p>⭐ Stars, 💎 Premium va 🎁 Giftlar — barchasi bitta joyda. Xavfsiz to'lov, avtomatik yetkazish.</p>
    <div class="pill">🚀 @shop_neonbot</div>
  </div>
</body>
</html>
