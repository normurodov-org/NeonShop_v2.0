<!--
  🍎 NeonShop logotipi — ANIQ (xiraroq EMAS) chizilishi uchun.

  🔴🔴 NIMA UCHUN QAYTA YOZILDI?
  Eski versiyada `<filter>` + `feDropShadow` ishlatilgan edi
  (`stdDeviation="16"`). SVG filtrlari Android WebView (Telegram ilovasi
  ichida) va ba'zi GPU'larda PASHAYI NATIJAGA rasterize qilinadi —
  ya'ni N va yulduz pikselli/ xiraroq chiqadi (mijoz rasmini yuborgan).

  ✅ YECHIM: filtrlardan BUTUNLAY voz kechildi. Chuqurlik endi
  quyidagicha beriladi — SOF shakllar bilan, hech qanday filtrsiz:
    * N ostida — siljitilgan to'q nusxa (`#4c1d95`, 0.22 shaffoflik)
    * yulduz ostida — kichik siljitilgan nusxa
  Natijada har qanday ekranda, har qanday WebView'da bir xil va ANIQ
  chiziladi (chiziqli SVG — kattalashtirilsa ham yo'qolmaydi).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="NeonShop">
  <defs>
    <!-- Fon gradienti -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="45%" stop-color="#9333ea" />
      <stop offset="85%" stop-color="#c026d3" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>

    <!-- Yulduz gradienti -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Fon ustidan yumshoq yorug'lik (sof shakl — filtr emas) -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Fon -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect width="512" height="290" rx="120" fill="url(#sheen)" />

  <!-- ═══ N ═══ -->

  <!-- 🔴 Chuqurlik: N ning ostida siljitilgan to'q nusxa.
       `filter` o'rniga — SOF shakl. Har qanday WebView'da aniq. -->
  <g fill="#4c1d95" opacity="0.22" transform="translate(0 18)">
    <path d="M 205 175 L 320 335 L 290 350 L 175 190 Z" />
    <rect x="170" y="155" width="60" height="210" rx="30" />
    <rect x="282" y="210" width="60" height="150" rx="30" />
  </g>

  <!-- N ning asosiy qismi -->
  <path d="M 205 175 L 320 335 L 290 350 L 175 190 Z" fill="#ede9fe" opacity="0.92" />
  <rect x="170" y="155" width="60" height="210" rx="30" fill="#ffffff" />
  <rect x="282" y="210" width="60" height="150" rx="30" fill="#ffffff" />

  <!-- ═══ Yulduz ═══ -->

  <!-- Chuqurlik: xuddi shu usulda -->
  <path
    d="M 312 120 L 326 150 L 358 153 L 333 175 L 341 206 L 312 189 L 283 206 L 291 175 L 266 153 L 298 150 Z"
    fill="#4c1d95" opacity="0.28" transform="translate(0 9)" />

  <!-- Yulduzning asosiy qismi -->
  <path
    d="M 312 120 L 326 150 L 358 153 L 333 175 L 341 206 L 312 189 L 283 206 L 291 175 L 266 153 L 298 150 Z"
    fill="url(#starGrad)"
    stroke="#f59e0b"
    stroke-width="2"
    stroke-linejoin="round" />
</svg>